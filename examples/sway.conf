# State-aware timer control: stop when running, resume the most recent activity when idle.
bindsym $mod+t exec --no-startup-id ~/.local/bin/toggl-waybar toggle

# Portable drawer placement follows the focused workspace output.
bindsym $mod+Shift+t exec --no-startup-id ~/.local/bin/toggl-waybar-drawer toggle

# The controller enters this mode when it is available and restores default on close.
mode "toggl-waybar-drawer" {
    bindsym Escape exec --no-startup-id ~/.local/bin/toggl-waybar-drawer close
    bindsym $mod+Shift+t exec --no-startup-id ~/.local/bin/toggl-waybar-drawer close
}

# To pin a shortcut to one output instead, use its exact Sway output name:
# bindsym $mod+Shift+t exec --no-startup-id ~/.local/bin/toggl-waybar-drawer toggle --output DP-1
